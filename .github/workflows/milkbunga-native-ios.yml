name: Milkbunga iOS - build unsigned IPA
on:
  push:
    branches: [milkbunga-ios-native]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate native project
        working-directory: NativeiOS
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compile for iPhone
        working-directory: NativeiOS
        run: |
          xcodebuild -project MilkbungaMobile.xcodeproj -scheme MilkbungaMobile -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA
        working-directory: NativeiOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MilkbungaMobile.app Payload/
          test -x Payload/MilkbungaMobile.app/MilkbungaMobile
          file Payload/MilkbungaMobile.app/MilkbungaMobile
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' Payload/MilkbungaMobile.app/Info.plist
          zip -qry MilkbungaMobile-unsigned.ipa Payload
          unzip -t MilkbungaMobile-unsigned.ipa
          shasum -a 256 MilkbungaMobile-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MilkbungaMobile-unsigned
          path: |
            NativeiOS/MilkbungaMobile-unsigned.ipa
            NativeiOS/SHA256.txt
